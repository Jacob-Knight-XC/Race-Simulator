name: Weekly racedata refresh

on:
  schedule:
    # Mondays 06:15 UTC — after typical weekend meets are posted.
    - cron: "15 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-racedata-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # GitHub-hosted max is 6 hours; full DIII crawl + Open-Meteo enrich
    # needs more than the previous 3h budget on a cold Meets table.
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-scraper.txt

      - name: Scrape TFRRS + enrich meet weather/location
        working-directory: scraper
        # Slightly higher concurrency than defaults; enrichment uses cached
        # geocodes + a small thread pool (ENRICH_WORKERS).
        run: >
          scrapy crawl xc
          -s ENRICH_MEETS=True
          -s ENRICH_WORKERS=6
          -s AUTOTHROTTLE_TARGET_CONCURRENCY=4
          -s CONCURRENT_REQUESTS=16
          -s DOWNLOAD_DELAY=0
          -s AUTOTHROTTLE_START_DELAY=0.5

      - name: Commit updated database if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/racedata.db data/scrape_errors.log || true
          if git diff --staged --quiet; then
            echo "No racedata changes to commit."
          else
            git commit -m "chore: weekly TFRRS racedata refresh"
            git push
          fi
