name: Weekly racedata refresh

on:
  schedule:
    # Mondays 06:15 UTC — after typical weekend meets are posted.
    - cron: "15 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-racedata-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape TFRRS + enrich meet weather/location
        working-directory: scraper
        run: scrapy crawl xc -s ENRICH_MEETS=True

      - name: Commit updated database if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/racedata.db data/scrape_errors.log || true
          if git diff --staged --quiet; then
            echo "No racedata changes to commit."
          else
            git commit -m "chore: weekly TFRRS racedata refresh"
            git push
          fi
