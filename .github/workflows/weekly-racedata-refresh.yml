name: Weekly racedata refresh

on:
  schedule:
    # Mondays 06:15 UTC — after typical weekend meets are posted.
    - cron: "15 6 * * 1"
  workflow_dispatch:
    inputs:
      division:
        description: "Which division DB to refresh (d3, naia, or both)"
        required: true
        default: both
        type: choice
        options:
          - both
          - d3
          - naia

permissions:
  contents: write

concurrency:
  group: weekly-racedata-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # GitHub-hosted max is 6 hours; DIII + NAIA crawl + Open-Meteo enrich
    # can approach that budget on a cold Meets table.
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-scraper.txt

      - name: Refresh USTFCCCA national poll snapshot
        run: python scripts/update_ustfccca_poll.py

      - name: Commit poll snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ustfccca_national_poll.json || true
          if git diff --staged --quiet; then
            echo "No USTFCCCA poll changes to commit."
          else
            git commit -m "chore: refresh USTFCCCA national poll snapshot"
            git push
          fi

      - name: Resolve divisions to scrape
        id: targets
        run: |
          CHOICE="${{ github.event.inputs.division || 'both' }}"
          if [ "$CHOICE" = "both" ]; then
            echo "list=d3 naia" >> "$GITHUB_OUTPUT"
          else
            echo "list=$CHOICE" >> "$GITHUB_OUTPUT"
          fi

      - name: Scrape TFRRS + enrich (per division)
        run: |
          set -euo pipefail
          for div in ${{ steps.targets.outputs.list }}; do
            echo "::group::Refresh $div"
            ./scripts/refresh_racedata.sh "$div"
            echo "::endgroup::"
          done

      - name: Commit updated databases if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/racedata.db app/racedata-naia.db data/scrape_errors.log || true
          if git diff --staged --quiet; then
            echo "No racedata changes to commit."
          else
            git commit -m "chore: weekly TFRRS racedata refresh"
            git push
          fi
